<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>PlantScanner</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #0f2418;
        color: #ffffff;
        overscroll-behavior: none;
      }
      #root {
        min-height: 100vh;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      input {
        font-family: inherit;
      }
      ::-webkit-scrollbar {
        width: 0;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
